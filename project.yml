name: ParkPours
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ParkPours:
    type: application
    platform: iOS
    sources:
      - ParkPours
    settings:
      base:
        # Placeholder: CI overrides this with the BUNDLE_ID secret.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.parkpours
        PRODUCT_NAME: ParkPours
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Park Pours
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Portrait only. On the Duo the upright "portrait" orientation is the
        # one we want in both states: closed it is the tall cover screen, open
        # it is the wide inner screen with the fold running top to bottom.
        # Asking for landscape while open turns the pages sideways.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
schemes:
  ParkPours:
    build:
      targets:
        ParkPours: all
    run:
      config: Debug
    archive:
      config: Release
